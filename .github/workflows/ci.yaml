name: Python CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install strictly locked dev dependencies (includes ruff, pytest, etc.)
        pip install -r requirements-dev.txt
        # Install the package itself
        pip install -e .

    - name: Lint with Ruff
      run: |
        ruff check src tests

    - name: Run demo script as a smoke test
      run: |
        # Basic smoke test to ensure entry point works. Later, more
        # comprehensive tests may be added using a small, committed sample.
        python main.py

    - name: Run tests with pytest
      run: |
        # Run tests and generate XML report for Codecov
        pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
