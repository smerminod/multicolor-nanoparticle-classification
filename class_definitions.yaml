# ===================================================================
# Database of all possible nanoparticle classes in this project
# ===================================================================
# This file is the master glossary for all unique nanoparticle compositions
# in this project, providing the scientific definition for each class label
# referenced in experiments.yaml.
#
# Structure:
#   nanoparticle_classes:
#     <class_name>:
#       elemental_fractions:
#         Tb: <fraction>  # Terbium     (main target of "CL blue" channel, peak emission ~537 nm)
#         Dy: <fraction>  # Dysprosium  (main target of "CL green" channel, peak emission ~565 nm)
#         Ho: <fraction>  # Holmium     (main target of "CL red" channel, peak emission ~640 nm)
#         Gd: <fraction>  # Gadolinium  (no significant CL emission)
#         Y:  <fraction>  # Yttrium     (no significant CL emission)
#
# Requirements:
#   - All five elements must be specified
#   - Each fraction must be in range [0, 1]
#   - Fractions must sum to exactly 1.0
#   - Keep order matching CL channel order (Tb → Dy → Ho → Gd → Y) for clarity, although this is not required
#
# Example:
#   Dy100:  # Pure Dysprosium
#     elemental_fractions: {Tb: 0.0, Dy: 1.0, Ho: 0.0, Gd: 0.0, Y: 0.0}
#
#   Tb50Dy50:  # 50/50 mixture
#     elemental_fractions: {Tb: 0.5, Dy: 0.5, Ho: 0.0, Gd: 0.0, Y: 0.0}

nanoparticle_classes:
  # Single-element classes
  'Tb100':
    elemental_fractions:
      Tb: 1.0
      Dy: 0.0
      Ho: 0.0
      Gd: 0.0
      Y: 0.0
  'Dy100':
    elemental_fractions:
      Tb: 0.0
      Dy: 1.0
      Ho: 0.0
      Gd: 0.0
      Y: 0.0
  'Ho100':
    elemental_fractions:
      Tb: 0.0
      Dy: 0.0
      Ho: 1.0
      Gd: 0.0
      Y: 0.0
  'Gd100':
    elemental_fractions:
      Tb: 0.0
      Dy: 0.0
      Ho: 0.0
      Gd: 1.0
      Y: 0.0

  # Two-element classes
  'Tb50Dy50':
    elemental_fractions:
      Tb: 0.5
      Dy: 0.5
      Ho: 0.0
      Gd: 0.0
      Y: 0.0
  'Tb50Ho50':
    elemental_fractions:
      Tb: 0.5
      Dy: 0.0
      Ho: 0.5
      Gd: 0.0
      Y: 0.0
  'Dy80Ho20':
    elemental_fractions:
      Tb: 0.0
      Dy: 0.8
      Ho: 0.2
      Gd: 0.0
      Y: 0.0
  'Dy65Ho35':
    elemental_fractions:
      Tb: 0.0
      Dy: 0.65
      Ho: 0.35
      Gd: 0.0
      Y: 0.0
  'Dy50Ho50':
    elemental_fractions:
      Tb: 0.0
      Dy: 0.5
      Ho: 0.5
      Gd: 0.0
      Y: 0.0
  'Dy30Ho70':
    elemental_fractions:
      Tb: 0.0
      Dy: 0.3
      Ho: 0.7
      Gd: 0.0
      Y: 0.0

  # Four-element classes
  'Tb20Dy20Ho20Y40':
    elemental_fractions:
      Tb: 0.2
      Dy: 0.2
      Ho: 0.2
      Gd: 0.0
      Y: 0.4